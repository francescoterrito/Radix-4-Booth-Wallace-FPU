<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">bfloat16 FPU with custom radix-4 Booth-Wallace significand multiplier</title>
  <desc id="desc">Two bfloat16 operands feed significand extraction, radix-4 Booth recoding, partial-product generation, Wallace compression, a ripple-carry adder, and the existing FMA normalization and rounding datapath.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.panel{fill:#111c2e;stroke:#44546f;stroke-width:2}.custom{fill:#12364a;stroke:#39b8d4;stroke-width:3}.fpu{fill:#24213d;stroke:#9a82e8;stroke-width:2}.label{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f7fb}.small{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b9c5d8}.accent{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#61d7ee}.arrow{stroke:#8fa5c5;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8fa5c5"/></marker>
  </defs>
  <rect class="bg" width="1280" height="500" rx="20"/>
  <text class="label" x="48" y="56">bfloat16 FMA product path</text>
  <text class="small" x="48" y="84">Sign and exponent processing remain in the supplied FPU; the custom block replaces the significand multiplier.</text>

  <rect class="fpu" x="48" y="145" width="150" height="120" rx="14"/>
  <text class="label" x="123" y="187" text-anchor="middle">Operands</text>
  <text class="small" x="123" y="216" text-anchor="middle">A, B</text>
  <text class="small" x="123" y="240" text-anchor="middle">16-bit FP16ALT</text>

  <rect class="fpu" x="245" y="145" width="170" height="120" rx="14"/>
  <text class="label" x="330" y="184" text-anchor="middle">Unpack</text>
  <text class="small" x="330" y="213" text-anchor="middle">restore implicit 1</text>
  <text class="small" x="330" y="237" text-anchor="middle">8-bit unsigned</text>

  <rect class="custom" x="462" y="118" width="190" height="174" rx="14"/>
  <text class="accent" x="557" y="151" text-anchor="middle">CUSTOM RTL</text>
  <text class="label" x="557" y="184" text-anchor="middle">Booth recoding</text>
  <text class="small" x="557" y="214" text-anchor="middle">zero-extend to 9 bits</text>
  <text class="small" x="557" y="238" text-anchor="middle">5 overlapping groups</text>
  <text class="small" x="557" y="262" text-anchor="middle">0, +/-A, +/-2A</text>

  <rect class="custom" x="699" y="118" width="185" height="174" rx="14"/>
  <text class="accent" x="791" y="151" text-anchor="middle">CUSTOM RTL</text>
  <text class="label" x="791" y="184" text-anchor="middle">Wallace tree</text>
  <text class="small" x="791" y="214" text-anchor="middle">partial-product matrix</text>
  <text class="small" x="791" y="238" text-anchor="middle">3 CSA stages</text>
  <text class="small" x="791" y="262" text-anchor="middle">final RCA</text>

  <rect class="fpu" x="931" y="145" width="155" height="120" rx="14"/>
  <text class="label" x="1008" y="185" text-anchor="middle">16-bit product</text>
  <text class="small" x="1008" y="214" text-anchor="middle">alignment and</text>
  <text class="small" x="1008" y="238" text-anchor="middle">FMA addition</text>

  <rect class="fpu" x="1133" y="145" width="110" height="120" rx="14"/>
  <text class="label" x="1188" y="185" text-anchor="middle">Round</text>
  <text class="small" x="1188" y="214" text-anchor="middle">normalize</text>
  <text class="small" x="1188" y="238" text-anchor="middle">pack</text>

  <path class="arrow" d="M198 205 H238"/><path class="arrow" d="M415 205 H455"/><path class="arrow" d="M652 205 H692"/><path class="arrow" d="M884 205 H924"/><path class="arrow" d="M1086 205 H1126"/>

  <rect class="panel" x="245" y="350" width="840" height="90" rx="12"/>
  <text class="label" x="665" y="384" text-anchor="middle">Preserved FPU pipeline and handshake</text>
  <text class="small" x="665" y="414" text-anchor="middle">valid/ready control - exponent alignment - add/subtract - normalization - status flags</text>
  <path class="arrow" d="M330 272 V342"/><path class="arrow" d="M1008 342 V272"/>
</svg>
